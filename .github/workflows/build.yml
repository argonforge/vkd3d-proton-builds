name: Build VKD3D-Proton with Clang

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v3.0.1)'
        required: true
        default: 'v3.0.1'
      draft:
        description: 'Create draft release'
        type: boolean
        default: false
  push:
    tags:
      - "v*.*.*"

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  DRAFT: ${{ inputs.draft || 'false' }}
  CCACHE_MAXSIZE: 2G
  CCACHE_COMPRESS: 'true'
  MESON_COMMON_ARGS: '--buildtype release -Db_lundef=false'

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        ver: [ v3, v4 ]
    runs-on: self-hosted
    timeout-minutes: 60
    container:
      image: archlinux/archlinux:multilib-devel
    env:
      CCACHE_DIR: /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}/.ccache-${{ matrix.ver }}
    steps:
      - name: Compute version variables
        run: |
          VKD3D_VERSION="${TAG#v}"
          echo "VKD3D_VERSION=$VKD3D_VERSION" >> $GITHUB_ENV
          echo "Using VKD3D_VERSION=$VKD3D_VERSION"

      - name: Checkout workflow repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies (Clang, MinGW, Meson)
        run: |
          pacman -Syu --needed --noconfirm \
            git meson ninja \
            ccache clang llvm lld mingw-w64-gcc mingw-w64-crt mingw-w64-headers \
            glslang python wine

      - name: Restore ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-vkd3d-clang-${{ matrix.ver }}-${{ github.sha }}
          restore-keys: |
            ccache-vkd3d-clang-${{ matrix.ver }}-

      - name: Configure ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --max-size="$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache -s

      - name: Install compiler wrappers
        run: |
          install -m 755 .github/helpers/clang-filtered.sh /usr/local/bin/clang-filtered
          install -m 755 .github/helpers/clang++-filtered.sh /usr/local/bin/clang++-filtered
          ls -l /usr/local/bin/clang*-filtered

      - name: Clone VKD3D-Proton source
        run: |
          rm -rf vkd3d-proton
          git clone --depth 1 --branch "${TAG}" \
            https://github.com/HansKristian-Work/vkd3d-proton.git \
            vkd3d-proton
          cd vkd3d-proton
          git submodule update --init --recursive

      - name: Copy Clang cross-files
        run: |
          cp .github/helpers/build-win64-clang-${{ matrix.ver }}.txt vkd3d-proton/build-win64-clang.txt
          cp .github/helpers/build-win32-clang-${{ matrix.ver }}.txt vkd3d-proton/build-win32-clang.txt
          ls -l vkd3d-proton/build-win*-clang.txt

      - name: Build VKD3D-Proton
        working-directory: vkd3d-proton
        run: |
          meson setup build.64-clang --cross-file=build-win64-clang.txt $MESON_COMMON_ARGS
          ninja -C build.64-clang

          meson setup build.32-clang --cross-file=build-win32-clang.txt $MESON_COMMON_ARGS
          ninja -C build.32-clang

          mkdir -p "vkd3d-proton-${VKD3D_VERSION}/x64" "vkd3d-proton-${VKD3D_VERSION}/x86"
          cp build.64-clang/libs/d3d12/d3d12.dll "vkd3d-proton-${VKD3D_VERSION}/x64/"
          cp build.64-clang/libs/d3d12core/d3d12core.dll "vkd3d-proton-${VKD3D_VERSION}/x64/"
          cp build.32-clang/libs/d3d12/d3d12.dll "vkd3d-proton-${VKD3D_VERSION}/x86/"
          cp build.32-clang/libs/d3d12core/d3d12core.dll "vkd3d-proton-${VKD3D_VERSION}/x86/"

          cp setup_vkd3d_proton.sh "vkd3d-proton-${VKD3D_VERSION}/"

          tar -caf "vkd3d-proton-${VKD3D_VERSION}-x86-64-${{ matrix.ver }}.tar.zst" "vkd3d-proton-${VKD3D_VERSION}"
          echo "Archive created:"
          ls -lh "vkd3d-proton-${VKD3D_VERSION}-x86-64-${{ matrix.ver }}.tar.zst"

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vkd3d-proton-archive-${{ matrix.ver }}
          path: vkd3d-proton/vkd3d-proton-*.tar.zst
          retention-days: ${{ env.DRAFT == 'true' && 1 || 5 }}

      - name: Show ccache stats
        if: always()
        run: ccache -s

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release and upload archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VKD3D_VERSION="${TAG#v}"
          FLAGS=(--latest)
          [[ $DRAFT = true ]] && FLAGS=(--draft)

          TITLE="VKD3D-Proton ${VKD3D_VERSION} (Clang)"
          [[ $DRAFT = true ]] && TITLE="[DRAFT] $TITLE"

          ls -lh artifacts/

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists - uploading files"
            gh release upload "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              artifacts/*.tar.zst
          else
            echo "Creating release $TAG"
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target ${{ github.sha }} \
              --title "$TITLE" \
              --notes-file .github/release-notes.md \
              "${FLAGS[@]}" \
              artifacts/*.tar.zst
          fi